name: INTISARI V4 three-stage curation

on:
  push:
    branches:
      - experiment/intisari-v4-curation
    paths:
      - "curate_intisari_v4_staged.py"
      - ".github/workflows/curate-intisari-v4.yml"
      - "data/external/intisari_v4/intisari_v4.jsonl"
      - "tests/test_intisari_curation.py"
      - "docs/INTISARI_V4_THREE_STAGE_PLAN.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-curation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test existing and staged curation rules
        run: |
          python -m unittest discover -s tests -p "test_intisari_curation.py" -v
      - name: Run all three stages on the full source
        run: |
          python curate_intisari_v4_staged.py --input data/external/intisari_v4/intisari_v4.jsonl --output-dir artifacts/intisari_v4_staged
      - name: Package staged outputs
        run: |
          cd artifacts
          zip -r intisari_v4_staged_curation.zip intisari_v4_staged
      - name: Upload staged curation artifact
        uses: actions/upload-artifact@v4
        with:
          name: intisari-v4-three-stage-curation
          path: artifacts/intisari_v4_staged_curation.zip
          if-no-files-found: error
          retention-days: 30
