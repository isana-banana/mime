name: Train MIME-ID 100K

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps"
        required: true
        default: "10000"
      batch_size:
        description: "Batch size"
        required: true
        default: "32"
  push:
    branches: [main]
    paths:
      - ".github/workflows/train.yml"
      - "prepare_data.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Indonesian training corpus
        run: |
          python prepare_data.py --dataset vickyfatrian/vqfat-indo-corpus --config cosmopedia_id --max-documents 50000 --output data/train.txt

      - name: Train model
        run: |
          python train.py --data data/train.txt --steps "${{ inputs.steps || '10000' }}" --batch-size "${{ inputs.batch_size || '32' }}" --device cpu

      - name: Upload checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: mime-id-100k-checkpoints
          path: checkpoints/*.pt
          if-no-files-found: error
          retention-days: 30
