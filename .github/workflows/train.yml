name: Train MIME-ID 300K

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps"
        required: true
        default: "6000"
      batch_size:
        description: "Batch size"
        required: true
        default: "32"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/mime-id-300k
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare curated Indonesian conversation corpus
        run: |
          python prepare_data.py --output data/train.txt
      - name: Train 300K model
        run: |
          python train.py --data data/train.txt --steps "${{ inputs.steps || '6000' }}" --batch-size "${{ inputs.batch_size || '32' }}" --device cpu
      - name: Upload checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: mime-id-300k-checkpoints
          path: checkpoints/*.pt
          if-no-files-found: error
          retention-days: 30
