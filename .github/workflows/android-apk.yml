name: Build MIME Chat APK

on:
  workflow_dispatch:
  push:
    branches: [feature/android-apk]
    paths:
      - 'app/**'
      - 'export_model.py'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download trained MIME-ID checkpoint
        uses: actions/download-artifact@v4
        with:
          name: mime-id-100k-checkpoints
          path: checkpoints
          repository: ${{ github.repository }}
          run-id: 45262581204
          github-token: ${{ github.token }}
      - name: Set up Python for model export
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export checkpoint for Android
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          python export_model.py checkpoints/best.pt app/src/main/assets/mime100k.bin
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mime-chat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
