name: Audit MIME-ID conversation corpus

on:
  push:
    branches: [experiment/mime-id-300k]
    paths:
      - "prepare_data.py"
      - "audit_data.py"\n      - "audit_synthetic.py"\n      - "data/synthetic/**"
      - ".github/workflows/audit-data.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/mime-id-300k
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax and corpus quality rules
        run: |
          python -m py_compile prepare_data.py audit_data.py audit_synthetic.py
          python -m unittest discover -s tests -v\n          python audit_synthetic.py
      - name: Build candidate conversation corpus
        run: python prepare_data.py --output data/candidate.txt --samples 100
      - name: Upload audit report, random samples, and candidate corpus
        uses: actions/upload-artifact@v4
        with:
          name: mime-id-conversation-corpus-audit
          path: |
            audit/
            data/candidate.txt
            data/synthetic/seed_v1.jsonl
            data/synthetic/README.md
          if-no-files-found: error
          retention-days: 30
